<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>deryann</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card-bg: #ffffff;
      --text: #1f2933;
      --text-muted: #5b6770;
      --border: #dde1e6;
      --accent: #2f6fdb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d;
        --card-bg: #1e242b;
        --text: #e6e9ed;
        --text-muted: #9aa5b1;
        --border: #2f3842;
        --accent: #7fb0ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    h2 {
      margin: 48px 0 16px;
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    p {
      margin: 0;
    }

    a {
      color: var(--accent);
    }

    .intro {
      color: var(--text-muted);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      padding: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--accent);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card-desc {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>👋 Hi, I’m deryann</h1>
      <p class="intro">
        對 coding、AI programming 以及各種軟體開發的事情感興趣。
        <a href="https://github.com/deryann">GitHub</a>
      </p>
    </header>

    <section>
      <h2>小工具</h2>
      <div class="cards">
        <a class="card" href="apps/word-test/">
          <div class="card-title">英文單字聽拼測驗</div>
          <p class="card-desc">聽發音、拼單字，給小孩練習用。可選測驗卷與題目範圍，也有老師模式。</p>
        </a>
        <a class="card" href="apps/guess-number/">
          <div class="card-title">猜數字 xAxB</div>
          <p class="card-desc">純前端的猜數字遊戲。</p>
        </a>
      </div>
    </section>

    <section>
      <h2>地圖資料</h2>
      <div class="cards">
        <a class="card" href="https://github.com/deryann/deryann/tree/main/geojson">
          <div class="card-title">台南</div>
          <p class="card-desc">路邊停車分級、安平管制區、公車站與 YouBike 站點等 GeoJSON。</p>
        </a>
        <a class="card" href="https://github.com/deryann/deryann/tree/main/geojson-txg">
          <div class="card-title">台中</div>
          <p class="card-desc">跨年活動管制區、街道、停車場等 GeoJSON。</p>
        </a>
        <a class="card" href="https://github.com/deryann/deryann/tree/main/geojson_hr">
          <div class="card-title">逐時資料</div>
          <p class="card-desc">00–23 時各一份的 GeoJSON。</p>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
